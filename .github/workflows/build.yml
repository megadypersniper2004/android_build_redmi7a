
name: Build LineageOS 15.1 Oreo for Redmi 7A

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git git-lfs gnupg \
            gperf imagemagick libncurses5-dev libncurses-dev \
            libssl-dev libxml2 libxml2-utils lzop \
            pngcrush rsync schedtool squashfs-tools \
            xsltproc zip zlib1g-dev python-is-python3 \
            openjdk-8-jdk

      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"
          curl -fL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize LineageOS 15.1
        run: |
          mkdir -p "$GITHUB_WORKSPACE/android"
          cd "$GITHUB_WORKSPACE/android"

          repo init \
            -u https://github.com/LineageOS/android.git \
            -b lineage-15.1 \
            --depth=1

      - name: Sync sources
        run: |
          cd "$GITHUB_WORKSPACE/android"
          repo sync -c -j2 --force-sync \
            --no-clone-bundle --no-tags

      - name: Configure device
        run: |
          cd "$GITHUB_WORKSPACE/android"
          source build/envsetup.sh

          if [ ! -f device/xiaomi/pine/AndroidProducts.mk ]; then
            echo "Redmi 7A device tree is missing."
            echo "A compatible Oreo device tree is required."
            exit 1
          fi

          lunch lineage_pine-userdebug

      - name: Build system image
        run: |
          cd "$GITHUB_WORKSPACE/android"
          source build/envsetup.sh
          lunch lineage_pine-userdebug
          make systemimage -j2

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lineage-15.1-redmi-7a
          path: |
            android/out/target/product/pine/system.img
            android/out/target/product/pine/*.zip
          if-no-files-found: warn
          retention-days: 7
