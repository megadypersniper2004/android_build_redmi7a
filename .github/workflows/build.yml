

name: Samsung Experience 9 - Redmi 7A

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git git-lfs gnupg \
            gperf liblz4-tool libncurses5-dev libssl-dev \
            libxml2-utils lzop pngcrush rsync \
            squashfs-tools xsltproc zip zlib1g-dev \
            openjdk-8-jdk python3 python-is-python3

      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"
          curl -fL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize Android 9 Pie
        run: |
          mkdir -p "$GITHUB_WORKSPACE/android"
          cd "$GITHUB_WORKSPACE/android"

          repo init \
            -u https://github.com/PixelExperience/manifest.git \
            -b pie \
            --depth=1

      - name: Add Redmi 7A device tree
        run: |
          cd "$GITHUB_WORKSPACE/android"
          mkdir -p .repo/local_manifests

          cat > .repo/local_manifests/pine.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project
              name="PixelExperience-Devices/device_xiaomi_pine"
              path="device/xiaomi/pine"
              remote="github"
              revision="pie" />
          </manifest>
          EOF

      - name: Sync Android sources
        run: |
          cd "$GITHUB_WORKSPACE/android"
          repo sync -c -j2 \
            --force-sync \
            --no-clone-bundle \
            --no-tags

      - name: Check device tree
        run: |
          cd "$GITHUB_WORKSPACE/android"

          for f in \
            device/xiaomi/pine/AndroidProducts.mk \
            device/xiaomi/pine/BoardConfig.mk \
            device/xiaomi/pine/device.mk \
            device/xiaomi/pine/aosp_pine.mk \
            device/xiaomi/pine/aosp.dependencies
          do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required file: $f"
              exit 1
            fi
          done

          echo "=== Product definitions ==="
          cat device/xiaomi/pine/AndroidProducts.mk

          echo "=== Dependencies ==="
          cat device/xiaomi/pine/aosp.dependencies

      - name: Check build target
        run: |
          cd "$GITHUB_WORKSPACE/android"
          source build/envsetup.sh
          lunch aosp_pine-userdebug

      - name: Build base images
        run: |
          cd "$GITHUB_WORKSPACE/android"
          source build/envsetup.sh
          lunch aosp_pine-userdebug
          make -j2 systemimage bootimage

      - name: Upload base build for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pine-Android9-base
          path: |
            android/out/target/product/pine/system.img
            android/out/target/product/pine/boot.img
          if-no-files-found: warn
          retention-days: 7
