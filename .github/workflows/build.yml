
name: Build Oreo for Redmi 7A

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git git-lfs gnupg \
            gperf liblz4-tool libncurses5-dev libssl-dev \
            libxml2-utils lzop pngcrush rsync \
            squashfs-tools xsltproc zip zlib1g-dev \
            openjdk-8-jdk python3

      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"
          curl -fL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize LineageOS 15.1
        run: |
          mkdir -p "$GITHUB_WORKSPACE/android"
          cd "$GITHUB_WORKSPACE/android"
          repo init \
            -u https://github.com/LineageOS/android.git \
            -b lineage-15.1 \
            --depth=1

      - name: Sync sources
        run: |
          cd "$GITHUB_WORKSPACE/android"
          repo sync -c -j2 \
            --force-sync \
            --no-clone-bundle \
            --no-tags

      - name: Check Pine device tree
        run: |
          cd "$GITHUB_WORKSPACE/android"

          if [ ! -f device/xiaomi/pine/AndroidProducts.mk ]; then
            echo "::error::Missing Oreo-compatible device tree for pine."
            echo "Add the device tree, kernel and required vendor files."
            exit 1
          fi

          echo "Device tree found."
          cat device/xiaomi/pine/AndroidProducts.mk

      - name: Configure build
        run: |
          cd "$GITHUB_WORKSPACE/android"
          source build/envsetup.sh
          lunch lineage_pine-userdebug

      - name: Build images
        run: |
          cd "$GITHUB_WORKSPACE/android"
          source build/envsetup.sh
          lunch lineage_pine-userdebug
          make -j2 systemimage bootimage

      - name: Upload images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Redmi7A-Oreo-images
          path: |
            android/out/target/product/pine/system.img
            android/out/target/product/pine/boot.img
          if-no-files-found: warn
          retention-days: 7
