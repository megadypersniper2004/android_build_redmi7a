
name: Build Oreo for Redmi 7A

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git git-lfs gnupg \
            gperf liblz4-tool libncurses5-dev libssl-dev \
            libxml2-utils lzop pngcrush rsync \
            squashfs-tools xsltproc zip zlib1g-dev \
            openjdk-8-jdk python3

      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"
          curl -fL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize LineageOS 15.1
        run: |
          mkdir -p "$GITHUB_WORKSPACE/android"
          cd "$GITHUB_WORKSPACE/android"

          repo init \
            -u https://github.com/LineageOS/android.git \
            -b lineage-15.1 \
            --depth=1

      - name: Add Pine source manifest
        run: |
          cd "$GITHUB_WORKSPACE/android"
          mkdir -p .repo/local_manifests

          cat > .repo/local_manifests/pine.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <remote name="github" fetch="https://github.com/" />

            <project
              name="PixelExperience-Devices/device_xiaomi_pine"
              path="device/xiaomi/pine"
              remote="github"
              revision="pie" />
          </manifest>
          EOF

      - name: Sync sources
        run: |
          cd "$GITHUB_WORKSPACE/android"
          repo sync -c -j2 \
            --force-sync \
            --no-clone-bundle \
            --no-tags

      - name: Check device configuration
        run: |
          cd "$GITHUB_WORKSPACE/android"

          for f in \
            device/xiaomi/pine/AndroidProducts.mk \
            device/xiaomi/pine/BoardConfig.mk \
            device/xiaomi/pine/device.mk
          do
            if [ ! -f "$f" ]; then
              echo "::error::Missing $f"
              exit 1
            fi
          done

          echo "=== Products ==="
          cat device/xiaomi/pine/AndroidProducts.mk

          echo "=== Declared dependencies ==="
          if [ -f device/xiaomi/pine/aosp.dependencies ]; then
            cat device/xiaomi/pine/aosp.dependencies
          fi

      - name: Configure build
        run: |
          cd "$GITHUB_WORKSPACE/android"
          source build/envsetup.sh
          lunch aosp_pine-userdebug

      - name: Build images
        run: |
          cd "$GITHUB_WORKSPACE/android"
          source build/envsetup.sh
          lunch aosp_pine-userdebug
          make -j2 systemimage bootimage

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Redmi7A-Oreo-test
          path: |
            android/out/target/product/pine/system.img
            android/out/target/product/pine/boot.img
          if-no-files-found: warn
          retention-days: 7
